<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>tunes-to-goon-to - Music Player</title>
  <meta name="description" content="Listen to tunes-to-goon-to static site music player">
  <meta name="theme-color" content="#000000">
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Ambient background glow matching track colors -->
  <div class="ambient-glow" id="ambientGlow"></div>

  <main class="player-container">
    <!-- Header -->
    <header class="player-header">
      <div class="site-badge">PLAYLIST</div>
      <h1 class="site-title">tunes-to-goon-to</h1>
    </header>

    <!-- Player Main Card -->
    <section class="player-card">
      <!-- Album Cover & Visualizer -->
      <div class="artwork-container">
        <div class="artwork-wrapper" id="artworkWrapper">
          <img id="coverImg" src="" alt="Album Artwork" class="cover-art" />
          <div class="cover-placeholder" id="coverPlaceholder">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M9 18V5l12-2v13" />
              <circle cx="6" cy="18" r="3" />
              <circle cx="18" cy="16" r="3" />
            </svg>
          </div>
        </div>
        <canvas id="visualizerCanvas" class="visualizer-canvas"></canvas>
      </div>

      <!-- Track Info -->
      <div class="track-meta">
        <h2 id="trackTitle" class="track-title">Loading...</h2>
        <p id="trackArtist" class="track-artist">Artist</p>
      </div>

      <!-- Scrubber / Progress Bar -->
      <div class="scrubber-container">
        <input type="range" id="seekSlider" class="seek-slider" min="0" max="100" value="0" step="0.1" aria-label="Track Progress">
        <div class="time-display">
          <span id="currentTime">0:00</span>
          <span id="durationTime">0:00</span>
        </div>
      </div>

      <!-- Controls Row -->
      <div class="controls-row">
        <button id="btnShuffle" class="icon-btn" title="Shuffle" aria-label="Shuffle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
        </button>

        <button id="btnPrev" class="icon-btn control-btn" title="Previous Track" aria-label="Previous">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>

        <button id="btnPlayPause" class="icon-btn play-btn" title="Play/Pause" aria-label="Play or Pause">
          <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          <svg id="pauseIcon" viewBox="0 0 24 24" fill="currentColor" class="hidden"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>

        <button id="btnNext" class="icon-btn control-btn" title="Next Track" aria-label="Next">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>

        <button id="btnRepeat" class="icon-btn" title="Repeat Mode" aria-label="Repeat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 2l4 4-4 4"/><path d="M3 11v-1a4 4 0 014-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v1a4 4 0 01-4 4H3"/></svg>
        </button>
      </div>

      <!-- Volume Bar -->
      <div class="volume-container">
        <button id="btnMute" class="icon-btn volume-btn" aria-label="Mute/Unmute">
          <svg id="volumeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.07"/></svg>
        </button>
        <input type="range" id="volumeSlider" class="volume-slider" min="0" max="1" step="0.01" value="0.9" aria-label="Volume">
      </div>
    </section>

    <!-- Playlist Queue Panel -->
    <section class="queue-section">
      <div class="queue-header">
        <h3>Queue (10 tracks)</h3>
      </div>
      <ul class="playlist-queue" id="playlistQueue">
        <!-- Rendered dynamically -->
      </ul>
    </section>

    <footer class="player-footer">
      <p>Built with Static Music Player Builder</p>
    </footer>
  </main>

  <script src="player.js"></script>
</body>
</html>
